<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KPACA FIX RED — Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0d0d0d;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 12px;
  }

  .header {
    text-align: center;
    margin-bottom: 4px;
  }
  .header h2 {
    color: #ff3b3b;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header p {
    color: #888;
    font-size: 0.72rem;
    margin-top: 2px;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, #ff3b3b55, transparent);
    margin: 4px 0;
  }

  .btn-grid {
    display: grid;
    width: 100%;
    max-width: 360px;
    gap: 10px;
  }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-1 { grid-template-columns: 1fr; }

  .btn {
    position: relative;
    border: none;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.12s, box-shadow 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-transform: uppercase;
  }
  .btn:active { transform: scale(0.95); }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.08);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .btn:active::after { opacity: 1; }

  /* danger — merah */
  .btn-danger {
    background: linear-gradient(135deg, #ff3b3b, #c0392b);
    color: #fff;
    box-shadow: 0 4px 18px #ff3b3b55;
  }
  /* primary — biru */
  .btn-primary {
    background: linear-gradient(135deg, #2196f3, #1565c0);
    color: #fff;
    box-shadow: 0 4px 18px #2196f355;
  }
  /* success — hijau */
  .btn-success {
    background: linear-gradient(135deg, #00c853, #1b5e20);
    color: #fff;
    box-shadow: 0 4px 18px #00c85355;
  }
  /* owner — emas */
  .btn-owner {
    background: linear-gradient(135deg, #ffd700, #b8860b);
    color: #1a1a1a;
    box-shadow: 0 4px 18px #ffd70055;
  }

  .icon { font-size: 1.1rem; }

  #owner-row { display: none; }
</style>
</head>
<body>

<div class="header">
  <h2>⚡ KPACA FIX RED</h2>
  <p>Pilih menu di bawah ini</p>
</div>
<div class="divider"></div>

<div class="btn-grid row-2">
  <button class="btn btn-danger"   onclick="send('🔴 Fix Merah')">
    <span class="icon">🔴</span> Fix Merah
  </button>
  <button class="btn btn-primary"  onclick="send('📧 Reset OTP')">
    <span class="icon">📧</span> Reset OTP
  </button>
</div>

<div class="btn-grid row-1">
  <button class="btn btn-success"  onclick="send('🔄 Order VIP')">
    <span class="icon">💎</span> Akses VIP
  </button>
</div>

<div class="btn-grid row-1" id="owner-row">
  <button class="btn btn-owner"    onclick="send('👑 Owner Menu')">
    <span class="icon">👑</span> Owner Menu
  </button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Sembunyikan / tampilkan Owner Menu berdasarkan query param ?owner=1
  const params = new URLSearchParams(window.location.search);
  if (params.get('owner') === '1') {
    document.getElementById('owner-row').style.display = 'grid';
  }

  // Warna background ikuti tema Telegram
  if (tg.colorScheme === 'light') {
    document.body.style.background = '#f0f0f0';
  }

  function send(text) {
    tg.sendData(text);
  }
</script>
</body>
</html>
